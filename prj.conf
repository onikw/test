#
# WiFi STA + HTTP client
#

# WiFi
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_NET_L2_WIFI_MGMT=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_SOCKETS_DNS_TIMEOUT=10000

# TLS (Mjolnir Ingest API pod HTTPS)
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=90000
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_TLS_VERSION_1_2=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ALL_ENABLED=y
CONFIG_MBEDTLS_CIPHER_ALL_ENABLED=y
CONFIG_MBEDTLS_MAC_ALL_ENABLED=y
CONFIG_MBEDTLS_ECP_ALL_ENABLED=y
CONFIG_MBEDTLS_PEM_CERTIFICATE_FORMAT=y
CONFIG_MBEDTLS_X509_LIBRARY=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=4
CONFIG_TLS_CREDENTIAL_FILENAMES=n

# HTTP client
CONFIG_HTTP_CLIENT=y
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y

# Net buffers / heaps (from NCS sta sample)
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NRF70_RX_NUM_BUFS=16
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=20000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=40000
CONFIG_NRF_WIFI_DISPLAY_SCAN_BSS_LIMIT=160
CONFIG_NET_TC_TX_COUNT=1

CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_MAX_CONTEXTS=5
CONFIG_NET_CONTEXT_SYNC_RECV=y
CONFIG_NET_SOCKETS_POLL_MAX=10

CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# Stacks
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_INIT_STACKS=y

CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

# GPIO (LED blink)
CONFIG_GPIO=y

# ADC (VDD measurement)
CONFIG_ADC=y

# I2C + ADXL345
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_ADXL345=y

# SPI + WS2812 LED strip
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

# Bluetooth (central: scan, connect to APP_BLE_TARGET_MAC, write 6B on activity change)
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="HackLED"
CONFIG_BT_MAX_CONN=1

# Entropy (WPA supplicant + BLE need RNG)
CONFIG_ENTROPY_GENERATOR=y

# Server (Mjolnir Ingest API – HTTPS)
CONFIG_APP_SERVER_HOST="virgin-classifieds-wheel-hey.trycloudflare.com"
CONFIG_APP_SERVER_PORT=443
CONFIG_APP_SERVER_URL_PATH="/api/mjolnir/ingest"
CONFIG_APP_DEVICE_ID="nrf7002dk"
CONFIG_APP_MJOLNIR_API_KEY="mjlnr_b042769922b73b6e1f6674154a3d340de336b1e229e6075c"

# Logging
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_PRINTK=y
CONFIG_POSIX_TIMERS=y

# Debug
CONFIG_ASSERT=y
CONFIG_STACK_SENTINEL=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y

# Edge Impulse SDK
CONFIG_EDGE_IMPULSE_SDK=y